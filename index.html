<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 번째 웹사이트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Malgun Gothic", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #333;
      padding: 16px;
    }
    .card {
      background: #fff;
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    h1 { font-size: 2rem; margin-bottom: 12px; } p { line-height: 1.6; color: #555; margin-bottom: 24px; }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: #667eea;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
    }
    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>안녕하세요! 👋</h1>
    <p>저의 첫 번째 웹사이트에 오신 것을 환영합니다.<br>Claude Code와 함께 만들고 GitHub Pages로 배포했어요.</p>
    <a href="https://github.com/shabudong0406-ui/my-first-website">GitHub 보기</a>
  </main>
</body>
</html>
